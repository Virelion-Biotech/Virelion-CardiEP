[project]
name = "virelion-cardiep"
version = "0.3.0"
description = "Patient-specific cardiac electrophysiology simulation, personalization, and backend orchestration for HeartTwin"
requires-python = ">=3.10"
license = {text = "AGPL-3.0-or-later"}
dependencies = [
  "numpy>=1.26,<3",
  "pydantic>=2.6,<3",
]

[project.optional-dependencies]
io = ["meshio>=5.3,<6"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
cardiep = "cardiep.cli:main"

[project.urls]
Repository = "https://github.com/Virelion-Biotech/Virelion-CardiEP"
Issues = "https://github.com/Virelion-Biotech/Virelion-CardiEP/issues"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
