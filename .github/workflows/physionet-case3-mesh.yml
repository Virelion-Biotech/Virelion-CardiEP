name: PhysioNet Case 3 ventricular mesh

on:
  pull_request:
    paths:
      - 'validation/physionet_case3/**'
      - '.github/workflows/physionet-case3-mesh.yml'

permissions:
  contents: read

jobs:
  mesh:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install constrained tetrahedral mesher
        run: |
          sudo apt-get -qq update
          sudo apt-get -qq install -y --no-install-recommends tetgen
          tetgen -h | head -40 || true
      - name: Build sealed public-data preflight
        run: python validation/physionet_case3/preflight.py
      - name: Build constrained patient ventricular volume mesh
        run: python validation/physionet_case3/mesh_patient.py
      - name: Install CardiEP
        run: python -m pip install -e .
      - name: Validate mesh through native CardiEP geometry loader
        shell: python
        run: |
          import hashlib
          from pathlib import Path
          from cardiep.geometry import _payload_to_geometry
          import json

          path = Path('case3_patient_mesh/native_ep_geometry.json')
          raw = json.loads(path.read_text(encoding='utf-8'))
          geometry = _payload_to_geometry(raw)
          assert geometry.n_nodes == len(raw['node_xyz'])
          assert len(geometry.tetrahedra) == len(raw['tetrahedra'])
          assert geometry.endocardial_nodes is not None and len(geometry.endocardial_nodes) >= 20
          assert len(geometry.electrodes_cm) == 120
          print(json.dumps({
              'nodes': geometry.n_nodes,
              'tetrahedra': len(geometry.tetrahedra),
              'edges': len(geometry.edges),
              'endocardial_nodes': len(geometry.endocardial_nodes),
              'electrodes': len(geometry.electrodes_cm),
              'geometry_sha256': hashlib.sha256(path.read_bytes()).hexdigest(),
          }, indent=2, sort_keys=True))
      - name: Upload patient mesh evidence
        uses: actions/upload-artifact@v4
        with:
          name: physionet-case3-patient-mesh
          path: |
            case3_preflight
            case3_patient_mesh
          if-no-files-found: error
