name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
        include:
          - os: windows-latest
            python-version: '3.12'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check src tests scripts
      - run: python -m pytest -q --cov=cardiep --cov-report=term --cov-fail-under=70
      - run: python -m cardiep validate-reference
      - run: python -m cardiep doctor

  independent-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e ".[dev,io,reference]"
      - run: python -m pytest tests/test_independent_numerics.py tests/test_cpu_audit.py -q

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install build
      - run: python -m build
      - run: python -m venv /tmp/cardiep-wheel
      - run: /tmp/cardiep-wheel/bin/python -m pip install dist/*.whl
      - run: cd /tmp && /tmp/cardiep-wheel/bin/python -m cardiep validate-reference
      - run: /tmp/cardiep-wheel/bin/python -m pip check

  cpu-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install .
      - run: python scripts/run_cpu_validation.py --output cpu-validation.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cpu-validation
          path: cpu-validation.json
          if-no-files-found: error
